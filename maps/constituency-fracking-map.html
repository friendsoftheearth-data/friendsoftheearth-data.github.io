<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oil and gas licences within constituencies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/FOE_Logo_only_favicon.png">

  <!-- External stylesheet -->
  <link rel="stylesheet" href="/assets/css/style-mobile.css">

  <!-- Leaflet styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="map-page">

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1. CREATE MAP AND BASEMAP
  const map = L.map('map', {
    preferCanvas: true,
    maxZoom: 15
  }).setView([53, -2.5], 7);

  map.createPane('labels');
  map.getPane('labels').style.zIndex = 650;
  map.getPane('labels').style.pointerEvents = 'none';

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© CARTO, Contains public sector information licensed under the Open Government Licence v3.0, OS data © Crown copyright and database right (2022)',
    subdomains: 'abcd',
    maxZoom: 18
  }).addTo(map);

  const labelsOnly = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    pane: 'labels',
    attribution: '© OpenStreetMap contributors, © CARTO',
    subdomains: 'abcd',
    maxZoom: 18
  });

  // 2. DATASET AND HELPER FUNCTIONS
  const dataUrl = '/datasets/fossil-fuels/pcon-onshore-og-licences.geojson';
  const licenceBlocksUrl = '/datasets/fossil-fuels/onshore-og-licences.geojson';
  const classCount = 5;
  const colourRamp = ['#f1e5e4', '#efc6cd', '#eca6b6', '#ea8794', '#ed6132'];

  let geojsonLayer = null;
  let classBreaks = null;
  let licenceBlocksLayer = null;
  let licenceBlocksVisible = true;
  let legendToggleInputs = [];

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatPercent(value) {
    if (value === null || value === undefined || value === '') return 'Not available';
    const num = Number(value);
    if (Number.isNaN(num)) return 'Not available';
    return `${Math.round(num * 100)}%`;
  }

  function getQuantileBreaks(values, nClasses) {
    const sorted = values
      .map(Number)
      .filter(v => Number.isFinite(v))
      .sort((a, b) => a - b);

    if (!sorted.length) return null;

    const breaks = [sorted[0]];

    for (let i = 1; i < nClasses; i++) {
      const pos = (sorted.length - 1) * (i / nClasses);
      const lowerIndex = Math.floor(pos);
      const upperIndex = Math.ceil(pos);
      const lower = sorted[lowerIndex];
      const upper = sorted[upperIndex];
      const fraction = pos - lowerIndex;
      const interpolated = lower + (upper - lower) * fraction;
      breaks.push(interpolated);
    }

    breaks.push(sorted[sorted.length - 1]);
    return breaks;
  }

  function getClassIndex(value) {
    if (!classBreaks) return 0;

    const num = Number(value);
    if (!Number.isFinite(num)) return 0;

    for (let i = 0; i < classBreaks.length - 1; i++) {
      const min = classBreaks[i];
      const max = classBreaks[i + 1];
      const isLast = i === classBreaks.length - 2;

      if ((num >= min && num < max) || (isLast && num <= max)) {
        return i;
      }
    }

    return classBreaks.length - 2;
  }

  function getFillColor(value) {
    return colourRamp[getClassIndex(value)] || colourRamp[0];
  }

  function layerStyle(feature) {
    const p = feature.properties || {};
    return {
      fillColor: getFillColor(p.licence_area_pct),
      color: '#4f5b7a',
      weight: 0.8,
      opacity: 1,
      fillOpacity: 0.8
    };
  }

  function licenceBlockStyle() {
    return {
      color: '#1e234d',
      weight: 1.5,
      opacity: 1,
      fillColor: '#f4f6fa',
      fillOpacity: 0.1
    };
  }

  function popupContent(feature, layer) {
    const p = feature.properties || {};

    const html = `
      <div class="popup-card popup-card--oilgas">
        <div class="popup-title">Constituency: <strong>${escapeHtml(p.constituency_name || 'Not available')}</strong></div>
        <div class="popup-grid popup-grid--oilgas">
          <div class="popup-label"><strong>MP name and party:</strong></div>
          <div class="popup-value popup-value--primary popup-value--wrap">${escapeHtml(p.mp_party || 'Not available')}</div>

          <div class="popup-label">Licence area (%):</div>
          <div class="popup-value popup-value--wrap">${escapeHtml(formatPercent(p.licence_area_pct))}</div>

          <div class="popup-label">Licence codes:</div>
          <div class="popup-value popup-value--wrap">${escapeHtml(p.licence_codes || 'Not available')}</div>

          <div class="popup-label">Licence organisations:</div>
          <div class="popup-value popup-value--wrap">${escapeHtml(p.licence_orgs || 'Not available')}</div>
        </div>
      </div>
    `;

    layer.bindPopup(html, {
      autoPan: false,
      maxWidth: 320
    });
  }

  function licenceBlockPopupContent(feature) {
    const p = feature.properties || {};

    return `
      <div class="popup-card popup-card--oilgas">
        <div class="popup-grid popup-grid--oilgas">
          <div class="popup-label">Licence ref:</div>
          <div class="popup-value popup-value--wrap">${escapeHtml(p.licence_no || 'Not available')}</div>

          <div class="popup-label">Licence organisations:</div>
          <div class="popup-value popup-value--wrap">${escapeHtml(p.licence_orgs || 'Not available')}</div>
        </div>
      </div>
    `;
  }

  function onEachLicenceBlock(feature, layer) {
    layer.bindPopup(licenceBlockPopupContent(feature), {
      maxWidth: 340,
      autoPan: true
    });
  }

  function updateLicenceToggleUI() {
    legendToggleInputs.forEach(input => {
      input.checked = licenceBlocksVisible;
      input.setAttribute('aria-checked', String(licenceBlocksVisible));
    });
  }

  function toggleLicenceBlocks() {
    if (!licenceBlocksLayer) return;

    if (map.hasLayer(licenceBlocksLayer)) {
      map.removeLayer(licenceBlocksLayer);
      licenceBlocksVisible = false;
    } else {
      licenceBlocksLayer.addTo(map);
      licenceBlocksLayer.bringToFront();
      labelsOnly.bringToFront();
      licenceBlocksVisible = true;
    }

    updateLicenceToggleUI();
  }

  async function loadLicenceBlocksLayer() {
    try {
      const res = await fetch(licenceBlocksUrl);
      if (!res.ok) {
        throw new Error(`Failed to load licence blocks GeoJSON: ${res.status}`);
      }

      const data = await res.json();

      licenceBlocksLayer = L.geoJSON(data, {
        style: licenceBlockStyle,
        onEachFeature: onEachLicenceBlock
      });

      if (licenceBlocksVisible) {
        licenceBlocksLayer.addTo(map);
        licenceBlocksLayer.bringToFront();
        labelsOnly.bringToFront();
      }

      updateLicenceToggleUI();
    } catch (err) {
      console.error('Error loading licence blocks GeoJSON:', err);
    }
  }

  // 3. HOVER AND CLICK BEHAVIOUR
  function highlightFeature(e) {
    const layer = e.target;
    layer.setStyle({
      stroke: true,
      color: '#1e234d',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    });

    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
      layer.bringToFront();

      if (licenceBlocksLayer && map.hasLayer(licenceBlocksLayer)) {
        licenceBlocksLayer.bringToFront();
      }

      labelsOnly.bringToFront();
    }
  }

  function resetHighlight(e) {
    if (geojsonLayer) {
      geojsonLayer.resetStyle(e.target);

      if (licenceBlocksLayer && map.hasLayer(licenceBlocksLayer)) {
        licenceBlocksLayer.bringToFront();
      }

      labelsOnly.bringToFront();
    }
  }

  function onEachFeature(feature, layer) {
    popupContent(feature, layer);

    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight,
      click: function (e) {
        const clickLatLng = e.latlng;

        map.panTo(clickLatLng, {
          animate: true,
          duration: 0.5
        });

        map.once('moveend', function () {
          layer.openPopup(clickLatLng);
        });
      }
    });
  }

  // 4. LEGEND
  const desktopLegend = L.control({ position: 'topright' });
  const mobileLegend = L.control({ position: 'bottomleft' });

  function getLegendRanges() {
    if (!classBreaks) return [];

    const ranges = [];
    for (let i = 0; i < classBreaks.length - 1; i++) {
      const from = Math.round(classBreaks[i] * 100);
      const to = Math.round(classBreaks[i + 1] * 100);
      ranges.push(`${from}-${to}%`);
    }
    return ranges;
  }

  function createLegendMarkup() {
    const ranges = getLegendRanges();

    return `
      <div class="legend-header">
        <div class="legend-title">Onshore oil and gas licences within constituencies</div>
        <button type="button" class="button button--small legend-toggle" aria-expanded="true">−</button>
      </div>
      <div class="legend-content">
        This map shows all the constituencies in England which have at least 1km2 covered by onshore oil and gas licence blocks.
        <br><br>
        There are 79 constituencies which have such licences in their area.
        <br>
        <hr class="hr-thin">
        <div class="legend-scale-title">Oil/Gas licence area (%)</div>
        <div class="legend-scale">
          <div class="legend-bar legend-bar--5 legend-bar--labelled">
            ${ranges.map((label, i) => `
              <span class="${i >= 3 ? 'legend-bar-accessible' : ''}" style="background:${colourRamp[i]}">
                <span class="legend-band-label">${escapeHtml(label)}</span>
              </span>
            `).join('')}
          </div>
        </div>

        <hr class="hr-thin">
        <div class="legend-overlay-row">
          <div class="legend-overlay-symbol legend-overlay-symbol--fill" aria-hidden="true"></div>
          <div class="legend-overlay-label">Onshore oil and gas licence blocks</div>
          <label class="legend-switch" aria-label="Toggle onshore oil and gas licence blocks">
            <input
              type="checkbox"
              class="legend-layer-switch-input"
              data-layer-toggle="licence-blocks"
              role="switch"
              aria-checked="true"
              checked
            >
            <span class="legend-switch-slider" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    `;
  }

  function buildLegend(wrapperClass, startMinimised = false) {
    const wrapper = L.DomUtil.create('div', wrapperClass);
    const container = L.DomUtil.create('div', 'legend', wrapper);

    if (startMinimised) {
      container.classList.add('is-minimised');
    }

    container.innerHTML = createLegendMarkup();

    const toggleBtn = container.querySelector('.legend-toggle');
    const content = container.querySelector('.legend-content');
    const layerToggleInput = container.querySelector('[data-layer-toggle="licence-blocks"]');

    function syncLegendState() {
      const isMinimised = container.classList.contains('is-minimised');
      toggleBtn.setAttribute('aria-expanded', String(!isMinimised));
      toggleBtn.textContent = isMinimised ? '+' : '−';
      content.style.display = isMinimised ? 'none' : 'block';
    }

    toggleBtn.addEventListener('click', () => {
      container.classList.toggle('is-minimised');
      syncLegendState();
    });

    if (layerToggleInput) {
      legendToggleInputs.push(layerToggleInput);
      layerToggleInput.addEventListener('change', function (evt) {
        evt.stopPropagation();
        toggleLicenceBlocks();
      });
    }

    syncLegendState();
    updateLicenceToggleUI();

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);
    return wrapper;
  }

  desktopLegend.onAdd = function () {
    return buildLegend('legend-desktop-wrapper', false);
  };

  mobileLegend.onAdd = function () {
    return buildLegend('legend-mobile-wrapper', true);
  };

  // 5. DATA LOAD
  async function loadOilGasLayer() {
    try {
      const res = await fetch(dataUrl);
      if (!res.ok) {
        throw new Error(`Failed to load GeoJSON: ${res.status}`);
      }

      const data = await res.json();
      const values = (data.features || [])
        .map(f => f?.properties?.licence_area_pct)
        .filter(v => v !== null && v !== undefined && v !== '');

      classBreaks = getQuantileBreaks(values, classCount);

      geojsonLayer = L.geoJSON(data, {
        style: layerStyle,
        onEachFeature: onEachFeature
      }).addTo(map);

      const bounds = geojsonLayer.getBounds();
      if (bounds && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [5, 5] });
      } else {
        map.setView([52.8, -1.5], 6);
      }

      labelsOnly.addTo(map);
      labelsOnly.bringToFront();

      desktopLegend.addTo(map);
      mobileLegend.addTo(map);

      await loadLicenceBlocksLayer();
    } catch (err) {
      console.error('Error loading oil and gas GeoJSON:', err);
      map.setView([52.8, -1.5], 6);
      labelsOnly.addTo(map);
      labelsOnly.bringToFront();

      desktopLegend.addTo(map);
      mobileLegend.addTo(map);

      await loadLicenceBlocksLayer();
    }
  }

  // 6. ATTRIBUTION CONTROL
  map.attributionControl.setPrefix(false);

  const attributionControl = L.control({ position: 'bottomright' });

  attributionControl.onAdd = function () {
    const wrapper = L.DomUtil.create('div', 'attribution-wrapper');
    const container = L.DomUtil.create('div', 'map-attribution is-minimised', wrapper);

    container.innerHTML = `
      <div class="attribution-header">
        <div class="attribution-title">Copyright acknowledgements</div>
        <button type="button" class="button button--small attribution-toggle" aria-expanded="false">+</button>
      </div>
      <div class="attribution-content">
        © CARTO, NSTA Open User Licence, OS data © Crown copyright and database right (2022). © OpenStreetMap contributors.
      </div>
    `;

    const toggleBtn = container.querySelector('.attribution-toggle');
    const content = container.querySelector('.attribution-content');

    function syncAttributionState() {
      const isMinimised = container.classList.contains('is-minimised');
      toggleBtn.setAttribute('aria-expanded', String(!isMinimised));
      toggleBtn.textContent = isMinimised ? '+' : '−';
      content.style.display = isMinimised ? 'none' : 'block';
    }

    toggleBtn.addEventListener('click', () => {
      container.classList.toggle('is-minimised');
      syncAttributionState();
    });

    syncAttributionState();

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);
    return wrapper;
  };

  // 7. ADD CONTROLS AND INITIALISE
  attributionControl.addTo(map);
  loadOilGasLayer();
</script>

<style>
  .legend-scale-title {
    margin-top: 0.2rem;
    margin-bottom: 0.45rem;
    font-weight: 700;
    color: #1e234d;
    line-height: 1.3;
  }

  .legend-bar--5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    min-height: 32px;
  }

  .legend-bar--labelled {
    width: 100%;
  }

  .legend-bar--labelled > span {
    padding: 0.35rem 0.25rem;
    text-align: center;
  }

  .legend-band-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.15;
    color: #1e234d;
    overflow-wrap: anywhere;
  }

  .legend-bar--labelled > span.legend-bar-accessible .legend-band-label {
    color: #f4f6fa;
  }

  .legend-overlay-row {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) auto;
    gap: 0.6rem;
    align-items: center;
    margin-top: 0.2rem;
  }

  .legend-overlay-symbol {
    width: 18px;
    height: 0;
    border-top: 2px solid #1e234d;
    justify-self: center;
  }

  .legend-overlay-symbol--fill {
    height: 12px;
    border: 1.5px solid #1e234d;
    background: rgba(244, 246, 250, 0.1);
  }

  .legend-overlay-label {
    line-height: 1.3;
    color: #1e234d;
  }

  .legend-switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 38px;
    height: 22px;
    cursor: pointer;
  }

  .legend-layer-switch-input {
    position: absolute;
    inset: 0;
    opacity: 0.0001;
    margin: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .legend-switch-slider {
    position: relative;
    display: block;
    width: 38px;
    height: 22px;
    background-color: #d9dde6;
    border-radius: 999px;
    transition: background-color 0.2s ease;
  }

  .legend-switch-slider::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    background-color: #ffffff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease;
  }

  .legend-layer-switch-input:checked + .legend-switch-slider {
    background-color: #61bdaa;
  }

  .legend-layer-switch-input:checked + .legend-switch-slider::before {
    transform: translateX(16px);
  }

  .legend-layer-switch-input:focus-visible + .legend-switch-slider {
    outline: 2px solid #1e234d;
    outline-offset: 2px;
  }

  .popup-card--oilgas {
    min-width: 220px;
    max-width: min(300px, 72vw);
  }

  .popup-grid--oilgas {
    grid-template-columns: minmax(0, 95px) minmax(0, 1fr);
    align-items: start;
  }

  .popup-value--wrap {
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  @media (max-width: 768px) {
    .legend-bar--5 {
      min-height: 32px;
    }

    .legend-band-label {
      font-size: 0.68rem;
      line-height: 1.1;
    }

    .legend-overlay-row {
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 0.5rem;
    }

    .leaflet-popup-content-wrapper {
      max-width: 90vw;
    }

    .leaflet-popup-content {
      max-height: 60vh;
      overflow-y: auto;
    }
  }
</style>

</body>
</html>
