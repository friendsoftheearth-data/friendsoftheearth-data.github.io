<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water companies: bills and pollution</title>
  <link rel="stylesheet" href="assets/css/style-mobile.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="map-page">
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { preferCanvas: true, maxZoom: 12 });
    map.createPane('labels');
    map.getPane('labels').style.zIndex = 650;
    map.getPane('labels').style.pointerEvents = 'none';

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      attribution: 'CARTO; Contains public sector information licensed under the Open Government Licence v3.0; OS data Crown copyright and database right 2022',
      subdomains: 'abcd',
      maxZoom: 18
    }).addTo(map);

    const labelsOnly = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
      pane: 'labels',
      attribution: 'OpenStreetMap contributors, CARTO',
      subdomains: 'abcd',
      maxZoom: 18
    });

    const layerConfigs = {
      bills: {
        key: 'bills',
        label: 'Water bills',
        description: 'Increase 2024–2027 (%)',
        field: 'changes_2025_27_pct',
        palette: ['#fee5d9', '#fcbba1', '#fc9272', '#fb6a4a', '#cb181d']
      },
      sewage: {
        key: 'sewage',
        label: 'Sewage pollution',
        description: 'Average spill duration per outlet (2025)',
        field: 'overflows_mean_duration_per_outlet_2025',
        palette: ['#feedde', '#fdbe85', '#fd8d3c', '#e6550d', '#a63603']
      },
      river: {
        key: 'river',
        label: 'River pollution',
        description: 'Ecological condition less than good (%)',
        field: 'ecological_class_less_than_good_pct',
        palette: ['#efedf5', '#bcbddc', '#9e9ac8', '#756bb1', '#54278f']
      }
    };

    let geojsonData = null;
    let geojsonLayer = null;
    let activeLayerKey = 'bills';
    let breaksByLayer = {};
    let lastHighlightedLayer = null;

    function isValidNumber(value) {
      return value !== null && value !== undefined && value !== '' && !Number.isNaN(Number(value));
    }

    function getQuantileBreaks(values, classes = 5) {
      const sorted = values
        .map(Number)
        .filter(v => Number.isFinite(v))
        .sort((a, b) => a - b);

      if (!sorted.length) return [];
      const breaks = [sorted[0]];
      for (let i = 1; i < classes; i += 1) {
        const index = Math.min(sorted.length - 1, Math.ceil((i * sorted.length) / classes) - 1);
        breaks.push(sorted[index]);
      }
      breaks.push(sorted[sorted.length - 1]);
      return breaks;
    }

    function getFillColor(value, config) {
      if (!isValidNumber(value)) return '#d9dde6';
      const numeric = Number(value);
      const breaks = breaksByLayer[config.key] || [];
      if (breaks.length < 2) return config.palette[config.palette.length - 1];
      for (let i = 1; i < breaks.length; i += 1) {
        if (numeric <= breaks[i]) return config.palette[i - 1];
      }
      return config.palette[config.palette.length - 1];
    }

    function formatValue(value, options = {}) {
      if (value === null || value === undefined || value === '') return 'Not available';
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return String(value);
      if (options.thousands) {
        return numeric.toLocaleString('en-GB');
      }
      return numeric.toLocaleString('en-GB', {
        minimumFractionDigits: options.decimals ?? 0,
        maximumFractionDigits: options.decimals ?? 1
      });
    }

    function popupContent(feature) {
      const p = feature.properties || {};
      return `
        <div class="popup-card">
          <div class="popup-title"><strong>${p.water_company ?? 'Not available'}</strong></div>
          <div class="popup-grid">
            <div class="popup-label"><strong>Water bills: increase 2024–2027 (%)</strong></div>
            <div class="popup-value popup-value--primary">${formatValue(p.changes_2025_27_pct)}</div>
            <div class="popup-label">Sewage pollution: Avg spill duration per outlet (2025)</div>
            <div class="popup-value">${formatValue(p.overflows_mean_duration_per_outlet_2025)}</div>
            <div class="popup-label">River pollution: Ecological condition less than good (%)</div>
            <div class="popup-value">${formatValue(p.ecological_class_less_than_good_pct)}</div>
            <div class="popup-label">Bathing waters: Less than good (%)</div>
            <div class="popup-value">${formatValue(p.bathing_poor_sufficient_2023_pct)}</div>
            <div class="popup-label">Bathing waters: pollution incidents/warnings</div>
            <div class="popup-value">${formatValue(p.bathing_incidents_warnings_total, { thousands: true })}</div>
          </div>
        </div>`;
    }

    function layerStyle(feature) {
      const config = layerConfigs[activeLayerKey];
      const value = feature.properties ? feature.properties[config.field] : null;
      return {
        fillColor: getFillColor(value, config),
        color: '#ffffff',
        weight: 1,
        opacity: 0.9,
        fillOpacity: 0.75
      };
    }

    function highlightFeature(e) {
      const layer = e.target;
      lastHighlightedLayer = layer;
      layer.setStyle({
        color: '#1e234d',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
      });
      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
        layer.bringToFront();
      }
    }

    function resetHighlight(e) {
      if (geojsonLayer) {
        geojsonLayer.resetStyle(e.target);
      }
    }

    function onEachFeature(feature, layer) {
      layer.bindPopup(popupContent(feature), { autoPan: false });
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: function () {
          const center = layer.getBounds().getCenter();
          map.panTo(center, { animate: true, duration: 0.5 });
          map.once('moveend', function () {
            layer.openPopup(center);
          });
        }
      });
    }

    function renderLayer() {
      if (!geojsonData) return;
      if (geojsonLayer && map.hasLayer(geojsonLayer)) {
        map.removeLayer(geojsonLayer);
      }
      geojsonLayer = L.geoJSON(geojsonData, {
        style: layerStyle,
        onEachFeature
      }).addTo(map);
      if (geojsonLayer.getBounds().isValid()) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
      }
      updateLegendScale();
    }

    function getLegendBarHtml(config) {
      return config.palette.map((color, idx) => {
        const accessibleClass = idx >= 3 ? ' legend-bar-accessible' : '';
        return `<span class="${accessibleClass.trim()}" style="background:${color}"></span>`;
      }).join('');
    }

    function formatBreakLabel(value) {
      if (!Number.isFinite(value)) return 'NA';
      return value.toLocaleString('en-GB', { maximumFractionDigits: 1 });
    }

    function updateLegendScale() {
      const config = layerConfigs[activeLayerKey];
      const breaks = breaksByLayer[config.key] || [];
      const scaleEl = document.getElementById('legend-scale');
      if (!scaleEl) return;
      const min = breaks.length ? formatBreakLabel(breaks[0]) : 'NA';
      const max = breaks.length ? formatBreakLabel(breaks[breaks.length - 1]) : 'NA';
      scaleEl.innerHTML = `
        <div class="legend-scale">
          <div class="legend-bar">${getLegendBarHtml(config)}</div>
          <div class="legend-scale-labels"><span>${min}</span><span>${max}</span></div>
        </div>`;
    }

    function createLegendMarkup() {
      return `
        <div class="legend-header">
          <div class="legend-title">Water companies: bills and pollution</div>
          <button type="button" class="button button--small legend-toggle" aria-expanded="true">−</button>
        </div>
        <div class="legend-content">
          <p>Description placeholder text.</p>
          <hr class="hr-thin" />
          <form class="layer-toggle-group" aria-label="Map layers">
            <label class="layer-toggle-option">
              <input type="radio" name="layer-toggle" value="bills" checked />
              <span>Water bills</span>
            </label>
            <label class="layer-toggle-option">
              <input type="radio" name="layer-toggle" value="sewage" />
              <span>Sewage pollution</span>
            </label>
            <label class="layer-toggle-option">
              <input type="radio" name="layer-toggle" value="river" />
              <span>River pollution</span>
            </label>
          </form>
          <div id="legend-layer-description" class="secondary-text" style="margin-top:0.75rem;"></div>
          <div id="legend-scale"></div>
        </div>`;
    }

    function buildLegend(wrapperClass, startMinimised = false) {
      const wrapper = L.DomUtil.create('div', wrapperClass);
      const container = L.DomUtil.create('div', 'legend', wrapper);
      if (startMinimised) container.classList.add('is-minimised');
      container.innerHTML = createLegendMarkup();

      const toggleBtn = container.querySelector('.legend-toggle');
      const content = container.querySelector('.legend-content');
      const radios = container.querySelectorAll('input[name="layer-toggle"]');
      const description = container.querySelector('#legend-layer-description');

      function syncLegendState() {
        const isMinimised = container.classList.contains('is-minimised');
        toggleBtn.setAttribute('aria-expanded', String(!isMinimised));
        toggleBtn.textContent = isMinimised ? '+' : '−';
        content.style.display = isMinimised ? 'none' : 'block';
      }

      function syncLayerControls() {
        radios.forEach(radio => {
          radio.checked = radio.value === activeLayerKey;
        });
        const config = layerConfigs[activeLayerKey];
        description.textContent = config.description;
      }

      toggleBtn.addEventListener('click', function () {
        container.classList.toggle('is-minimised');
        syncLegendState();
      });

      radios.forEach(radio => {
        radio.addEventListener('change', function () {
          if (radio.checked) {
            activeLayerKey = radio.value;
            document.querySelectorAll('input[name="layer-toggle"]').forEach(el => {
              el.checked = el.value === activeLayerKey;
            });
            renderLayer();
            syncAllLegendDescriptions();
          }
        });
      });

      syncLegendState();
      syncLayerControls();
      container.dataset.legendReady = 'true';
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);
      return wrapper;
    }

    function syncAllLegendDescriptions() {
      document.querySelectorAll('.legend').forEach(container => {
        const desc = container.querySelector('#legend-layer-description');
        if (desc) desc.textContent = layerConfigs[activeLayerKey].description;
        container.querySelectorAll('input[name="layer-toggle"]').forEach(el => {
          el.checked = el.value === activeLayerKey;
        });
      });
      updateLegendScale();
    }

    const desktopLegend = L.control({ position: 'topright' });
    const mobileLegend = L.control({ position: 'bottomleft' });

    desktopLegend.onAdd = function () {
      return buildLegend('legend-desktop-wrapper', false);
    };

    mobileLegend.onAdd = function () {
      return buildLegend('legend-mobile-wrapper', true);
    };

    const attributionControl = L.control({ position: 'bottomright' });
    attributionControl.onAdd = function () {
      const wrapper = L.DomUtil.create('div', 'attribution-wrapper');
      const container = L.DomUtil.create('div', 'map-attribution is-minimised', wrapper);
      container.innerHTML = `
        <div class="attribution-header">
          <div class="attribution-title">Copyright acknowledgements</div>
          <button type="button" class="button button--small attribution-toggle" aria-expanded="false">+</button>
        </div>
        <div class="attribution-content">CARTO; Contains public sector information licensed under the Open Government Licence v3.0; OS data Crown copyright and database right 2022. OpenStreetMap contributors.</div>`;
      const toggleBtn = container.querySelector('.attribution-toggle');
      const content = container.querySelector('.attribution-content');
      function syncState() {
        const isMinimised = container.classList.contains('is-minimised');
        toggleBtn.setAttribute('aria-expanded', String(!isMinimised));
        toggleBtn.textContent = isMinimised ? '+' : '−';
        content.style.display = isMinimised ? 'none' : 'block';
      }
      toggleBtn.addEventListener('click', function () {
        container.classList.toggle('is-minimised');
        syncState();
      });
      syncState();
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);
      return wrapper;
    };

    async function initialise() {
      const response = await fetch('datasets/water/watercompany-bills-pollution-stats.geojson');
      if (!response.ok) throw new Error('Unable to load GeoJSON');
      geojsonData = await response.json();

      Object.values(layerConfigs).forEach(config => {
        const values = (geojsonData.features || [])
          .map(feature => feature.properties ? feature.properties[config.field] : null)
          .filter(isValidNumber)
          .map(Number);
        breaksByLayer[config.key] = getQuantileBreaks(values, 5);
      });

      renderLayer();
      labelsOnly.addTo(map);
      desktopLegend.addTo(map);
      mobileLegend.addTo(map);
      map.attributionControl.setPrefix(false);
      attributionControl.addTo(map);
      syncAllLegendDescriptions();
    }

    initialise().catch(error => {
      console.error(error);
      map.setView([53.5, -2.5], 6);
      labelsOnly.addTo(map);
    });
  </script>
</body>
</html>
