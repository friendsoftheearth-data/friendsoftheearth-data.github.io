<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IMED version 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/FOE_Logo_only_favicon.png">

  <!-- External stylesheet (ours) -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Leaflet styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
    }

    #map {
      height: 100vh;
    }

    .legend {
      background: #f4f6fa;
      padding: 1em;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #1e234d;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      border-radius: 4px;
      min-width: 200px;
      max-width: 300px;
      position: relative;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border-radius: 2px;
      border: 1px solid #ccc;
      flex: 0 0 16px;
    }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    preferCanvas: true
  }).setView([53, -2.5], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors & Carto',
    subdomains: 'abcd',
    maxZoom: 18
  }).addTo(map);

  function getDecileColor(decile) {
    const value = Number(decile);

    const colors = {
      1: '#ed6132',
      2: '#f08654',
      3: '#f4ad78',
      4: '#f7d099',
      5: '#faf5bb',
      6: '#dcd8b3',
      7: '#bedbab',
      8: '#84c29c',
      9: '#48a88c',
      10: '#098d7b'
    };

    return colors[value] || '#bdbdbd';
  }

  function formatDecile(value) {
    if (value === null || value === undefined || value === '') return 'Not available';
    const num = Number(value);
    return Number.isNaN(num) ? value : num;
  }

  function layerStyle(feature) {
    const p = feature.properties || {};
    return {
      fillColor: getDecileColor(p.imed_decile),
      stroke: false,
      fillOpacity: 0.8
    };
  }

  function popupContent(feature, layer) {
  const p = feature.properties || {};
  const name = p.lsoa11 || 'Area';

  const html = `
    <strong>${name}</strong><br>
    <br>
    Pollution decile: ${formatDecile(p.pollution_decile_imed)}<br>
    Nature decile: ${formatDecile(p.nature_decile_imed)}<br>
    Climate decile: ${formatDecile(p.climate_decile_imed)}<br>
    IMED decile: ${formatDecile(p.imed_decile)}
  `;

  layer.bindPopup(html);
}

  const legend = L.control({ position: 'topright' });

  legend.onAdd = function () {
    const container = L.DomUtil.create('div', 'legend');
    container.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Index of Multiple Environmental Deprivation (IMED)</strong>
        <button id="legend-toggle" class="button button--small" style="margin-left:8px;">−</button>
      </div>
      <div id="legend-content" style="margin-top:8px;">
        This map shows IMED deciles from 1 to 10, where 1 represents the most environmentally deprived neighbourhoods, and 10 the least deprived.
        
        The IMED brings together six datasets across three domains: pollution (air quality, noise pollution), nature (greenspace and tree cover), and climate extremes (flood risk and extreme heat).
        
        More details on the analysis and methodology can be found <a href="https://friendsoftheearth.uk/about/environmental-justice-protecting-people-and-planet" target="_blank" rel="noopener noreferrer">here</a>.
        <hr class="hr-thin">
        <div class="legend-item"><span class="legend-color" style="background:#ed6132"></span><span>1</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#f08654"></span><span>2</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#f4ad78"></span><span>3</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#f7d099"></span><span>4</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#faf5bb"></span><span>5</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#dcd8b3"></span><span>6</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#bedbab"></span><span>7</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#84c29c"></span><span>8</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#48a88c"></span><span>9</span></div>
        <div class="legend-item"><span class="legend-color" style="background:#098d7b"></span><span>10</span></div>
      </div>
    `;
    return container;
  };

  legend.addTo(map);

  setTimeout(() => {
    const btn = document.getElementById('legend-toggle');
    const content = document.getElementById('legend-content');

    if (btn && content) {
      btn.addEventListener('click', () => {
        const isHidden = content.style.display === 'none';
        content.style.display = isHidden ? 'block' : 'none';
        btn.textContent = isHidden ? '−' : '+';
      });
    }
  }, 0);

  fetch('/datasets/imed/imed-v1.geojson')
    .then(res => res.json())
    .then(data => {
      const geojsonLayer = L.geoJSON(data, {
        style: layerStyle,
        onEachFeature: popupContent
      }).addTo(map);

      map.fitBounds(geojsonLayer.getBounds(), {
        padding: [20, 20]
      });
    })
    .catch(err => {
      console.error('Error loading GeoJSON:', err);
    });
</script>

</body>
</html>
