<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energy crisis hotspots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/FOE_Logo_only_favicon.png">
  
  <!-- External stylesheet (ours) -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Leaflet styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; }
    #map { height: 100vh; }

    .legend {
      background: #f4f6fa;
      padding: 1em;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #1e234d;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      border-radius: 4px;
      min-width: 200px;
      max-width: 300px;
      position: relative;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border-radius: 2px;
      border: 1px solid #ccc;
    }

    /* LAD label styling */
    .lad-label {
      color: #1e234d;
      font-size: 0.75rem;
      font-weight: 600;
      text-shadow: 0 0 3px rgba(255,255,255,0.8);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    preferCanvas: true
  }).setView([54, -2.5], 6);

  const legend = L.control({ position: 'topright' });

  legend.onAdd = function () {
    const container = L.DomUtil.create('div', 'legend');
    container.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Energy crisis hotspots 2025</strong>
        <button id="legend-toggle" class="button button--small" style="margin-left:8px;">−</button>
      </div>
      <div id="legend-content" style="margin-top:8px;">
        Friends of the Earth has identified the neighbourhoods where high energy bills intersect with low incomes, based on energy consumption data, 2025 energy prices and income deprivation data. Predicted energy bills for 2026 have also been estimated. For more details see <a href="/some-detail-page">here</a>.
        <hr class="hr-thin">
        <div class="legend-item" style="margin-top:8px;">
          <span class="legend-color" style="background:#ed6132"></span>
          <span>Energy crisis hotspots</span>        
        </div>
        <hr class="hr-thin">
        <div class="legend-item" style="margin-top:8px;">
          <input type="checkbox" id="toggle-lad" />
          <span class="legend-color" style="background:transparent; border:2px dashed #1e234d;"></span>
          <label for="toggle-lad">Local authorities</label>
        </div>
        <hr class="hr-thin">
      </div>
    `;
    return container;
  };

  legend.addTo(map);

  // Wait for legend button to exist
  setTimeout(() => {
    const btn = document.getElementById('legend-toggle');
    const content = document.getElementById('legend-content');

    if (btn && content) {
      btn.addEventListener('click', () => {
        const isHidden = content.style.display === 'none';
        content.style.display = isHidden ? 'block' : 'none';
        btn.textContent = isHidden ? '−' : '+';
      });
    }
  }, 0);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors & Carto',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  const hotspotStyle = {
    fillColor: '#ed6132', // fill colour of the polygon
    color: '#f4f6fa',     // stroke (boundary) colour
    weight: 0.5,          // stroke thickness in pixels
    fillOpacity: 0.7,     // transparency of the fill
    opacity: 1            // opacity of the stroke
  };

  // LAD boundary style (dashed dark line)
  const ladStyle = {
    color: '#1e234d',
    weight: 1,
    dashArray: '4 4',
    fillOpacity: 0
  };

  // Only keep features where energy_crisis_hotspot == 'Energy crisis hotspot'
  function hotspotFilter(feature) {
    const p = feature.properties || {};
    return p.energy_crisis_hotspot === 'Energy crisis hotspot';
  }

  function formatPounds(x) {
    if (x === null || x === undefined || x === '') return 'Not available';
    const num = Number(x);
    if (isNaN(num)) return x;
    return '£' + num.toLocaleString('en-GB', { maximumFractionDigits: 0 });
  }

  function formatPercentFromProportion(x) {
    if (x === null || x === undefined || x === '') return 'Not available';
    const num = Number(x);
    if (isNaN(num)) return x;
    const pct = Math.round(num * 100);
    return pct + '%';
  }

  function popupHotspot(feature, layer) {
    const p = feature.properties || {};

    const name = p.name || p.lsoa21nm || 'Energy crisis hotspot';

    const currentBill = formatPounds(p.energy_bill_current);
    const futureBill = formatPounds(p.energy_bill_future);
    const imdIncome = p.imd_income_decile ?? 'Not available';
    const epcIneff = formatPercentFromProportion(p.epcs_DEFG_pct);

    const lsoa = p.lsoa21 ?? 'Not available';
    const msoaName = p.msoa21_name ?? 'Not available';

    const html = `
      <strong>${name}</strong><br>
      ${lsoa} in ${msoaName}<br>
      <br>
      Current average energy bill (£): ${currentBill}<br>
      Projected average energy bill (£): ${futureBill}<br>
      IMD income decile (1 = most deprived): ${imdIncome}<br>
      Poorly insulated homes (EPC D or lower) (%): ${epcIneff}
    `;

    layer.bindPopup(html);
  }

  // LAD popup
  function popupLAD(feature, layer) {
    const p = feature.properties || {};
    const name = p.local_authority ?? 'Local authority';
    layer.bindPopup(`<strong>${name}</strong>`);
  }

  let ladLayer;
  let hotspotLayer;

  fetch('/datasets/energy/energy-crisis-hotspots-lsoa21.geojson')
    .then(res => res.json())
    .then(data => {
      hotspotLayer = L.geoJSON(data, {
        style: hotspotStyle,
        filter: hotspotFilter,
        onEachFeature: popupHotspot
      }).addTo(map);

      // If LAD is already loaded and on the map, keep hotspots on top
    if (ladLayer && map.hasLayer(ladLayer)) {
      hotspotLayer.bringToFront();
    }
    });

  fetch('/datasets/energy/lad-boundaries.geojson')
    .then(res => res.json())
    .then(data => {
      // Boundaries layer (toggleable)
      ladLayer = L.geoJSON(data, {
        style: ladStyle,
        onEachFeature: popupLAD
      });
      // ensure hotspot polygons stay visually on top when both are on
      if (hotspotLayer) {
        hotspotLayer.bringToFront();
      }
    });
  
  // LAD toggle
  setTimeout(() => {
    const ladToggle = document.getElementById('toggle-lad');
    if (ladToggle) {
      ladToggle.addEventListener('change', (e) => {
        if (!ladLayer) return;
        if (e.target.checked) {
          ladLayer.addTo(map);
          if (hotspotLayer) {
          hotspotLayer.bringToFront();   // ensure hotspots sit above LAD
          }
        } else {
          map.removeLayer(ladLayer);
        }
      });
    }
  }, 0);
  
</script>

</body>
</html>
