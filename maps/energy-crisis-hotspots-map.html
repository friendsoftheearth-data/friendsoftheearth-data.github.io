<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energy crisis hotspots map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/FOE_Logo_only_favicon.png">
  
  <!-- External stylesheet (ours) -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Leaflet styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; }
    #map { height: 100vh; }

    .legend {
      background: #f4f6fa;
      padding: 1em;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #1e234d;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      border-radius: 4px;
      min-width: 200px;
      max-width: 300px;
      position: relative;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border-radius: 2px;
      border: 1px solid #ccc;
    }

    /* LAD label styling */
    .lad-label {
      color: #1e234d;
      font-size: 0.75rem;
      font-weight: 600;
      text-shadow: 0 0 3px rgba(255,255,255,0.8);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map', {
    preferCanvas: true
  }).setView([53, -2.5], 7); // initial zoom was 6

  // Pane for LAD boundary lines (above overlays)
  map.createPane('lad-boundary-pane');
  map.getPane('lad-boundary-pane').style.zIndex = 450; // higher than overlayPane (default 400)
  
  const legend = L.control({ position: 'topright' });

  legend.onAdd = function () {
    const container = L.DomUtil.create('div', 'legend');
    container.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>Energy crisis hotspots 2025</strong>
        <button id="legend-toggle" class="button button--small" style="margin-left:8px;">−</button>
      </div>
      <div id="legend-content" style="margin-top:8px;">
        Friends of the Earth has identified the neighbourhoods where high energy bills intersect with low incomes, based on energy consumption data, 2025 energy prices and income deprivation data. Predicted energy bills for 2026 have also been estimated. For more details see <a href="/some-detail-page">here</a>.
        <hr class="hr-thin">
        <div class="legend-item" style="margin-top:8px;">
          <span class="legend-color" style="background:#ed6132"></span>
          <span>Energy crisis hotspots</span>        
        </div>
        <hr class="hr-thin">
        <div class="legend-item" style="margin-top:8px;">
          <label class="switch">
            <input type="checkbox" id="toggle-lad">
            <span class="slider"></span>
          </label>
          <span class="legend-color" style="background:transparent; border:2px dashed #1e234d;"></span>
          <label for="toggle-lad">Local authority boundaries</label>
        </div>
        <hr class="hr-thin">
      </div>
    `;
    return container;
  };

  legend.addTo(map);

  // Wait for legend button to exist
  setTimeout(() => {
    const btn = document.getElementById('legend-toggle');
    const content = document.getElementById('legend-content');

    if (btn && content) {
      btn.addEventListener('click', () => {
        const isHidden = content.style.display === 'none';
        content.style.display = isHidden ? 'block' : 'none';
        btn.textContent = isHidden ? '−' : '+';
      });
    }
  }, 0);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors & Carto | Contains public sector information licensed under the Open Government Licence v3.0 | OS data © Crown copyright and database right (2022)',
    subdomains: 'abcd',
    maxZoom: 18 // initial level was 19
  }).addTo(map);

  const hotspotStyle = {
    fillColor: '#ed6132', // fill colour of the polygon
    color: '#f4f6fa',     // stroke (boundary) colour
    weight: 0.5,          // stroke thickness in pixels
    fillOpacity: 0.7,     // transparency of the fill
    opacity: 1            // opacity of the stroke
  };

  // LAD boundary line style (non-interactive, on its own pane)
  const ladBoundaryStyle = {
    pane: 'lad-boundary-pane',
    color: '#1e234d',
    weight: 1,
    dashArray: '4 4',
    fillOpacity: 0,
    interactive: false
  };
  
  // LAD clickable polygon style (same geometry, lower z-order)
  const ladClickStyle = {
    color: '#1e234d',
    weight: 0,      // no visible stroke for the clickable layer
    fillOpacity: 0, // invisible; we rely only on click area
    interactive: true
  };

  // Only keep features where energy_crisis_hotspot == 'Energy crisis hotspot'
  function hotspotFilter(feature) {
    const p = feature.properties || {};
    return p.energy_crisis_hotspot === 'Energy crisis hotspot';
  }

  function formatPounds(x) {
    if (x === null || x === undefined || x === '') return 'Not available';
    const num = Number(x);
    if (isNaN(num)) return x;
    return '£' + num.toLocaleString('en-GB', { maximumFractionDigits: 0 });
  }

  function formatNumber(x) {
    if (x === null || x === undefined || x === '') return 'Not available';
    const num = Number(x);
    if (isNaN(num)) return x;
    return num.toLocaleString('en-GB', { maximumFractionDigits: 0 });
  }

  function formatPercentFromProportion(x) {
    if (x === null || x === undefined || x === '') return 'Not available';
    const num = Number(x);
    if (isNaN(num)) return x;
    const pct = Math.round(num * 100);
    return pct + '%';
  }

  function popupHotspot(feature, layer) {
    const p = feature.properties || {};

    const name = p.name || p.lsoa21nm || 'Energy crisis hotspot';

    const currentBill = formatPounds(p.energy_bill_current);
    const futureBill = formatPounds(p.energy_bill_future);
    const imdIncome = p.imd_income_decile ?? 'Not available';
    const epcIneff = formatPercentFromProportion(p.epcs_DEFG_pct);

    const lsoa = p.lsoa21 ?? 'Not available';
    const msoaName = p.msoa21_name ?? 'Not available';

    const html = `
      <strong>${name}</strong><br>
      ${lsoa} in ${msoaName}<br>
      <br>
      Current average energy bill (£): ${currentBill}<br>
      Projected average energy bill (£): ${futureBill}<br>
      IMD income decile (1 = most deprived): ${imdIncome}<br>
      Poorly insulated homes (EPC D or lower) (%): ${epcIneff}
    `;

    layer.bindPopup(html);
  }

  // LAD popup
  function popupLAD(feature, layer) {
    const p = feature.properties || {};
    const name = p.local_authority ?? 'Local authority';

    const echNeighbourhoods = formatNumber(p.ech_lsoa_n);
    const ehcHomes = formatNumber(p.ech_homes_n);
    const ehcAverageBill = formatPounds(p.ech_average_bill);
    const ehcFutureBill = formatPounds(p.ech_future_bill);
    const ehcIneff = formatPercentFromProportion(p.ech_epc_inefficient_pct);

    const html = `
      <strong>${name}</strong><br>
      <br>
      Energy crisis hotspots (neighbourhoods): ${echNeighbourhoods}<br>
      <br>
      Homes in energy crisis hotspots: ${ehcHomes}<br>
      Average bill in hotspots (£): ${ehcAverageBill}<br>
      Average predicted bill in hotspots (£): ${ehcFutureBill}<br>
      Poorly insulated homes in hotspots (%): ${ehcIneff}
    `;
          
    // layer.bindPopup(`<strong>${name}</strong>`);
    layer.bindPopup(html);
    
  }

  let ladBoundaryLayer;
  let ladClickLayer;
  let hotspotLayer;

  fetch('/datasets/energy/energy-crisis-hotspots-lsoa21.geojson')
    .then(res => res.json())
    .then(data => {
      hotspotLayer = L.geoJSON(data, {
        style: hotspotStyle,
        filter: hotspotFilter,
        onEachFeature: popupHotspot
      }).addTo(map);
  });

  fetch('/datasets/energy/energy-crisis-hotspots-lad25.geojson')
    .then(res => res.json())
    .then(data => {
      // Visible boundary lines, non-interactive, in high-zIndex pane
      ladBoundaryLayer = L.geoJSON(data, {
        style: ladBoundaryStyle
      });
  
      // Invisible clickable polygons in default overlay pane
      ladClickLayer = L.geoJSON(data, {
        style: ladClickStyle,
        onEachFeature: popupLAD
      });

      // Make sure hotspots are on top for clicks if already loaded
      if (hotspotLayer) {
        hotspotLayer.bringToFront();
      }
  });
  
  // LAD toggle
  setTimeout(() => {
    const ladToggle = document.getElementById('toggle-lad');
    if (ladToggle) {
      ladToggle.addEventListener('change', (e) => {
        if (!ladBoundaryLayer || !ladClickLayer) return;
        if (e.target.checked) {
          ladBoundaryLayer.addTo(map);
          ladClickLayer.addTo(map);
          if (hotspotLayer) hotspotLayer.bringToFront();
        } else {
          map.removeLayer(ladBoundaryLayer);
          map.removeLayer(ladClickLayer);
        }
      });
    }
  }, 0);
  
</script>

</body>
</html>
